services:
  - type: web
    name: tickets-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: GMAIL_USER
        value: your_email@gmail.com
      - key: GMAIL_APP_PASSWORD
        value: your_gmail_app_password
      - key: DB_DIALECT
        value: sqlite
      - key: DB_NAME
        value: tickets_db
      - key: DB_STORAGE
        value: ./database.sqlite
